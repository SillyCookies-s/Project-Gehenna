apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gehenna
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SillyCookies-s/Project-Gehenna.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: gehenna
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true